name: CI

on:
  push:
    branches: ["main", "develop", "nightly", "release/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop", "nightly", "release/**"]
  workflow_dispatch:
    inputs:
      run_acp_agent_relay_real:
        description: "Run the Codex-orchestrated Pact source harness to real Antigravity ACP relay gate"
        type: boolean
        default: false
      run_acp_agent_relay_real_connect:
        description: "Also require Antigravity Connect trajectory evidence for the real ACP relay gate"
        type: boolean
        default: false
      run_acp_agent_relay_codex_cli:
        description: "Also require Codex CLI participation plus Codex downstream target gates"
        type: boolean
        default: false
      run_regression_report:
        description: "Run the broader non-blocking regression test report"
        type: boolean
        default: false
      run_external_dependency_report:
        description: "Run the external service/dependency compatibility report"
        type: boolean
        default: false
      run_release_readiness:
        description: "Run the release readiness gate"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Hygiene ────────────────────────────────────────────────────────────────
  hygiene:
    name: Hygiene checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Repository hygiene
        run: npm run repo:hygiene
      - name: Security hygiene
        run: npm run security:hygiene

  # ── TypeScript type check ──────────────────────────────────────────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  # ── Frontend build ─────────────────────────────────────────────────────────
  build-renderer:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build renderer
        run: npm run build:renderer:raw
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: renderer-dist
          path: build/dist/
          retention-days: 7

  # ── PR core functionality gate ─────────────────────────────────────────────
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    needs: [hygiene, build-renderer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client-cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('client-cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install dependencies
        run: npm ci
      - name: Download renderer dist
        uses: actions/download-artifact@v4
        with:
          name: renderer-dist
          path: build/dist/
      - name: Run PR core tests
        run: npm run test:core
        env:
          PACT_UNIT_COVERAGE_ALLOW_MISSING: "1"
      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-core
          path: build/test-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ── PR audit gate ──────────────────────────────────────────────────────────
  audit-checks:
    name: Audit checks
    runs-on: ubuntu-latest
    needs: [hygiene]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run document and code audit checks
        run: npm run test:audit
        env:
          PACT_UNIT_COVERAGE_ALLOW_MISSING: "1"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-audit
          path: build/test-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ── Optional regression report ─────────────────────────────────────────────
  regression-report:
    name: Regression report
    runs-on: ubuntu-latest
    needs: [build-renderer]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_regression_report }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client-cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('client-cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: npm ci
      - name: Install Flutter dependencies
        run: npm run client:get
      - name: Download renderer dist
        uses: actions/download-artifact@v4
        with:
          name: renderer-dist
          path: build/dist/
      - name: Run regression tests as report
        run: npm run test:regression -- --continue-on-failure
        env:
          PACT_UNIT_COVERAGE_ALLOW_MISSING: "1"
      - name: Upload regression test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-regression
          path: build/test-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ── Optional external service/dependency report ────────────────────────────
  external-dependency-report:
    name: External dependency report
    runs-on: ubuntu-latest
    needs: [build-renderer]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_dependency_report }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client-cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('client-cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            dbus-x11 \
            imagemagick \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config \
            scrot \
            xdotool \
            xvfb
      - name: Install dependencies
        run: npm ci
      - name: Install Flutter dependencies
        run: npm run client:get
      - name: Download renderer dist
        uses: actions/download-artifact@v4
        with:
          name: renderer-dist
          path: build/dist/
      - name: Run external service/dependency compatibility report
        run: npm run test:external
        env:
          PACT_UNIT_COVERAGE_ALLOW_MISSING: "1"
      - name: Upload external dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-external-dependencies
          path: build/test-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ── Optional Docker build report ───────────────────────────────────────────
  docker-build:
    name: Docker build report
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_dependency_report }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pact-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Real local-agent relay gate ───────────────────────────────────────────
  acp-agent-relay-real:
    name: ACP Agent Relay real Antigravity gate
    runs-on: [self-hosted, macOS, antigravity]
    needs: [hygiene]
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_acp_agent_relay_real }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run top-level real ACP relay gate
        env:
          RUN_CONNECT: ${{ inputs.run_acp_agent_relay_real_connect }}
          RUN_CODEX_CLI: ${{ inputs.run_acp_agent_relay_codex_cli }}
        run: |
          if [ "$RUN_CONNECT" = "true" ] && [ "$RUN_CODEX_CLI" = "true" ]; then
            npm run server:verify:acp-agent-relay-real:connect:codex-cli
          elif [ "$RUN_CODEX_CLI" = "true" ]; then
            npm run server:verify:acp-agent-relay-real:codex-cli
          elif [ "$RUN_CONNECT" = "true" ]; then
            npm run server:verify:acp-agent-relay-real:connect
          else
            npm run server:verify:acp-agent-relay-real
          fi

  # ── Release readiness gate ─────────────────────────────────────────────────
  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [ci-required]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_release_readiness) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client-cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('client-cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            dbus-x11 \
            imagemagick \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config \
            scrot \
            xdotool \
            xvfb
      - name: Install dependencies
        run: npm ci
      - name: Install Flutter dependencies
        run: npm run client:get
      - name: Run full release tests
        run: npm run test:full
        env:
          PACT_UNIT_COVERAGE_ALLOW_MISSING: "1"
      - name: Verify v0.0.1 readiness
        run: npm run server:verify:v001
      - name: Verify production readiness
        run: npm run server:verify:production-readiness -- --output-root build/reports/production-readiness
      - name: Upload release readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-artifacts
          path: |
            build/test-reports/
            build/artifacts/
            build/reports/
            docs/reports/history/production-readiness/
            docs/reports/history/v001-readiness/
            reports/v001-readiness/
            reports/production-readiness/
          if-no-files-found: ignore
          retention-days: 30

  # ── Branch protection aggregate ────────────────────────────────────────────
  ci-required:
    name: Required CI gate
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - typecheck
      - build-renderer
      - core-tests
      - audit-checks
    if: always()
    steps:
      - name: Fail if any required job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "Required CI gate failed."
          echo "${{ toJson(needs) }}" | jq -r '
            to_entries
            | map(
              select(
                .value.result == "failure"
                or .value.result == "cancelled"
                or .value.result == "skipped"
              )
              | "\(.key): \(.value.result)"
            )
            | .[]
          '
          exit 1
      - name: Required CI passed
        run: echo "All required CI gates passed."
