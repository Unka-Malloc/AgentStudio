name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require stable publish source
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF_TYPE}" != "branch" ] || [ "${GITHUB_REF_NAME}" != "stable" ]; then
              echo "Manual publish dispatch must use the stable branch, got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}."
              exit 1
            fi
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            git fetch --no-tags origin stable
            RELEASE_SHA="$(git rev-parse HEAD)"
            if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/stable; then
              echo "Release tag commit ${RELEASE_SHA} is not contained in origin/stable."
              exit 1
            fi
            exit 0
          fi

          echo "Unsupported publish event: ${GITHUB_EVENT_NAME}."
          exit 1

  package-status:
    needs: release-source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version v${{ steps.version.outputs.version }}."
            exit 1
          fi
      - id: registry
        run: |
          if npm view "pactium@${{ steps.version.outputs.version }}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "pactium@${{ steps.version.outputs.version }} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "pactium@${{ steps.version.outputs.version }} is not published yet."
          fi

  verify:
    needs: release-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run verify:release

  publish:
    needs: [release-source, package-status, verify]
    if: needs.package-status.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run verify:release
      - run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${{ needs.package-status.outputs.version }}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version v${{ needs.package-status.outputs.version }}."
            exit 1
          fi
      - run: |
          if npm view "pactium@${{ needs.package-status.outputs.version }}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "pactium@${{ needs.package-status.outputs.version }} became published before this job reached npm publish; skipping."
            exit 0
          fi
          npm publish --access public
