<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Pact product capability matrix">
  <title>Pact product capability matrix</title>
  <desc>A six-part matrix showing Pact capabilities: agent governance, agent library, checkpoint tree, MCP-native local agent onboarding, ACP relay, and contribution leaderboard.</desc>
  <defs>
    <linearGradient id="pm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="pm-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#0d0d11"/>
    </linearGradient>
    <linearGradient id="pm-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0"/>
      <stop offset="18%" stop-color="#c9a96e" stop-opacity="0.65"/>
      <stop offset="82%" stop-color="#6a9ec0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6a9ec0" stop-opacity="0"/>
    </linearGradient>
    <style>
      .panel { fill: url(#pm-card); stroke: #3a3028; stroke-width: 1; }
      .panel-rule { stroke: url(#pm-rule); stroke-width: 1; }
      .body-band { fill: #151319; stroke: #2f2823; stroke-width: 1; opacity: 0.92; }
      .kicker {
        font-family: "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 5px;
        fill: #b9aa90;
      }
      .title {
        font-family: "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 19px;
        font-weight: 750;
        fill: #f3ead9;
      }
      .subtitle {
        font-family: "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 520;
        fill: #d1c5b2;
      }
      .body {
        font-family: "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 430;
        fill: #b4aa99;
      }
      .tag {
        font-family: "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 700;
      }
      .tag-brass { fill: #f0b545; }
      .tag-verdigris { fill: #62c39a; }
      .tag-steel { fill: #7eb6df; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="14" fill="url(#pm-bg)"/>

  <text x="600" y="48" text-anchor="middle" class="kicker">GOVERNED AGENT WORKSPACE</text>
  <line x1="208" y1="66" x2="992" y2="66" stroke="url(#pm-rule)" stroke-width="1"/>

  <g transform="translate(40,92)">
    <rect class="panel" x="0" y="0" width="352" height="236" rx="8"/>
    <line class="panel-rule" x1="18" y1="1" x2="334" y2="1"/>
    <text class="title" x="26" y="39">Agent Governance</text>
    <text class="subtitle" x="26" y="66">Policy gate plus operation ledger</text>
    <rect class="body-band" x="22" y="82" width="308" height="48" rx="6"/>
    <text class="body" x="34" y="100">Writes, exports, and knowledge access pass</text>
    <text class="body" x="34" y="118">policy checks before execution.</text>
    <text class="tag tag-brass" x="26" y="158">Policy-checked</text>
    <text class="tag tag-verdigris" x="176" y="182" text-anchor="middle">Ledgered</text>
    <text class="tag tag-steel" x="326" y="206" text-anchor="end">Auditable</text>
  </g>

  <g transform="translate(424,92)">
    <rect class="panel" x="0" y="0" width="352" height="236" rx="8"/>
    <line class="panel-rule" x1="18" y1="1" x2="334" y2="1"/>
    <text class="title" x="26" y="39">Agent Library</text>
    <text class="subtitle" x="26" y="66">Knowledge slices with scoped egress</text>
    <rect class="body-band" x="22" y="82" width="308" height="48" rx="6"/>
    <text class="body" x="34" y="100">Controlled views, context copies, and</text>
    <text class="body" x="34" y="118">checkouts are authorized on each access.</text>
    <text class="tag tag-brass" x="26" y="158">Scoped Views</text>
    <text class="tag tag-verdigris" x="176" y="182" text-anchor="middle">Context Handoff</text>
    <text class="tag tag-steel" x="326" y="206" text-anchor="end">Governed Export</text>
  </g>

  <g transform="translate(808,92)">
    <rect class="panel" x="0" y="0" width="352" height="236" rx="8"/>
    <line class="panel-rule" x1="18" y1="1" x2="334" y2="1"/>
    <text class="title" x="26" y="39">Checkpoint Tree</text>
    <text class="subtitle" x="26" y="66">Replayable state and rollback</text>
    <rect class="body-band" x="22" y="82" width="308" height="48" rx="6"/>
    <text class="body" x="34" y="100">Reads, denials, writes, and restores</text>
    <text class="body" x="34" y="118">become recoverable checkpoint nodes.</text>
    <text class="tag tag-brass" x="26" y="158">Point-in-time</text>
    <text class="tag tag-verdigris" x="176" y="182" text-anchor="middle">Restore path</text>
    <text class="tag tag-steel" x="326" y="206" text-anchor="end">Append-only</text>
  </g>

  <g transform="translate(40,356)">
    <rect class="panel" x="0" y="0" width="352" height="236" rx="8"/>
    <line class="panel-rule" x1="18" y1="1" x2="334" y2="1"/>
    <text class="title" x="26" y="39">MCP Native Ecosystem</text>
    <text class="subtitle" x="26" y="66">Adapts multiple agent frameworks</text>
    <rect class="body-band" x="22" y="82" width="308" height="48" rx="6"/>
    <text class="body" x="34" y="100">One governed MCP service connects local</text>
    <text class="body" x="34" y="118">agents without per-framework rewiring.</text>
    <text class="tag tag-brass" x="26" y="158">Broad Adapter Reach</text>
    <text class="tag tag-verdigris" x="176" y="182" text-anchor="middle">One-Line Onboarding</text>
    <text class="tag tag-steel" x="326" y="206" text-anchor="end">Local Grant Flow</text>
  </g>

  <g transform="translate(424,356)">
    <rect class="panel" x="0" y="0" width="352" height="236" rx="8"/>
    <line class="panel-rule" x1="18" y1="1" x2="334" y2="1"/>
    <text class="title" x="26" y="39">ACP Agent Relay</text>
    <text class="subtitle" x="26" y="66">Governed agent delegation</text>
    <rect class="body-band" x="22" y="82" width="308" height="48" rx="6"/>
    <text class="body" x="34" y="100">Source agents delegate through virtual</text>
    <text class="body" x="34" y="118">inbound projections with policy mediation.</text>
    <text class="tag tag-brass" x="26" y="158">Relay session</text>
    <text class="tag tag-verdigris" x="176" y="182" text-anchor="middle">Delegation grant</text>
    <text class="tag tag-steel" x="326" y="206" text-anchor="end">Tool projection</text>
  </g>

  <g transform="translate(808,356)">
    <rect class="panel" x="0" y="0" width="352" height="236" rx="8"/>
    <line class="panel-rule" x1="18" y1="1" x2="334" y2="1"/>
    <text class="title" x="26" y="39">Contribution Leaderboard</text>
    <text class="subtitle" x="26" y="66">Compute to durable digital assets</text>
    <rect class="body-band" x="22" y="82" width="308" height="48" rx="6"/>
    <text class="body" x="34" y="100">Reusable knowledge, rules, and skills</text>
    <text class="body" x="34" y="118">are scored back to people and agents.</text>
    <text class="tag tag-brass" x="26" y="158">Ranked</text>
    <text class="tag tag-verdigris" x="176" y="182" text-anchor="middle">Reusable</text>
    <text class="tag tag-steel" x="326" y="206" text-anchor="end">Quantified</text>
  </g>

  <line x1="72" y1="624" x2="1128" y2="624" stroke="url(#pm-rule)" stroke-width="1" opacity="0.6"/>
</svg>
