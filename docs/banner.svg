<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Pact — Trusted Agent Collaboration Space">
  <title>Pact — Trusted Agent Collaboration Space</title>

  <defs>
    <!--
      Seal icon anatomy (centered at origin, applied via transform="translate(350,200)"):
        · Outer octagon  — R=125, flat-top orientation (22.5° rotated)
        · Ring 1         — r=113, concentric
        · Ring 2         — r=89,  offset (-16, 16)   → creates crossing/depth illusion
        · Ring 3         — r=63,  offset (+13, -10)  → crosses in opposite direction
        · Inner ring     — r=36,  concentric

      Computed octagon vertices (R=125, angles: 22.5° + k×45° for k=0…7):
        cos(22.5°)=0.92388  sin(22.5°)=0.38268
        cos(67.5°)=0.38268  sin(67.5°)=0.92388
        (remaining four are negated pairs)
        → x = ±(0.92388×125) = ±115.48   |   ±(0.38268×125) = ±47.84
    -->
    <style>
      .ring { fill: none; }
    </style>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────────────────── -->
  <rect width="1200" height="400" fill="#000000"/>

  <!-- ── Seal Icon — centered at (350, 200) ────────────────────────────────── -->
  <g transform="translate(350,200)" class="ring">

    <!-- Outer octagon (flat-top, R=125) -->
    <polygon
      points="
        115.5, 47.8
         47.8,115.5
        -47.8,115.5
       -115.5, 47.8
       -115.5,-47.8
        -47.8,-115.5
         47.8,-115.5
        115.5,-47.8"
      stroke="#f0f0f0" stroke-width="1.6"/>

    <!-- Ring 1 — concentric, just inside the octagon -->
    <circle r="113" stroke="#e4e4e4" stroke-width="1.4"/>

    <!-- Ring 2 — offset SW, creates the crossing illusion at NE & SW edges -->
    <circle cx="-16" cy="16" r="89" stroke="#cccccc" stroke-width="1.25"/>

    <!-- Ring 3 — offset NE, crosses in the opposite arcs -->
    <circle cx="13" cy="-10" r="63" stroke="#b0b0b0" stroke-width="1.1"/>

    <!-- Inner ring — concentric, anchors the centre -->
    <circle r="36" stroke="#949494" stroke-width="1.0"/>

  </g>

  <!-- ── Wordmark: "PACT" ───────────────────────────────────────────────────── -->
  <!--
    Layout target: visually center the text block at y=200.
    Georgia 96px: cap-height ≈ 70px, so optical centre ≈ baseline − 35.
    dominant-baseline="middle" handles vertical centering automatically.
    x=565 leaves a ~80px gap from the icon's right edge (350+115=465 + 100).
  -->
  <text
    x="565" y="200"
    dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="400"
    letter-spacing="16"
    fill="#ffffff">PACT</text>

  <!-- ── Subtitle ───────────────────────────────────────────────────────────── -->
  <!--
    Positioned 62px below the PACT baseline (200 + 35 cap-half + 16 gap + 11 cap-half of subtitle).
    x offset +1 to optically align with the inner white space of "P".
  -->
  <text
    x="566" y="270"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="15"
    font-weight="300"
    letter-spacing="4.5"
    fill="#686868">Trusted Agent Collaboration Space</text>

</svg>
