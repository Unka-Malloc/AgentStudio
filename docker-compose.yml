services:
  pactium:
    build: .
    image: pactium:local
    container_name: pactium
    ports:
      - "127.0.0.1:7288:7288"
    environment:
      PACTIUM_DATA_DIR: /data
      PACTIUM_HTTP_HOST: "0.0.0.0"
      PACTIUM_HTTP_PORT: "7288"
      PACTIUM_HTTP_MAX_BODY_BYTES: "1048576"
    volumes:
      - pactium-data:/data

volumes:
  pactium-data:
