# ==============================================================================
# Pact — Docker Compose
#
# Usage:
#   docker compose up -d
#
# Access the Web Console at http://127.0.0.1:7228
#
# This configuration binds to 127.0.0.1 only — safe for local development and
# evaluation. For production deployment, place this behind a TLS-terminating
# reverse proxy and apply network isolation. See README.md for full guidance.
# ==============================================================================
services:
  pact-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: pact-server:local
    container_name: pact-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:7228:7228"
    environment:
      PACT_SERVER_HOST: 0.0.0.0
      PACT_SERVER_PORT: 7228
      PACT_SERVER_DATA_DIR: /data
      PACT_SERVER_WITH_UI: "1"
      PACT_BOOTSTRAP_URL: http://127.0.0.1:7228
      PACT_ADVERTISED_BASE_URL: http://127.0.0.1:7228
      PACT_ACTIVE_SERVICE_URL: http://127.0.0.1:7228
    volumes:
      - ${HOME}/.pact-server-data:/data
      # Uncomment the line below to mount host Codex configuration (optional, read-only recommended):
      # - ${HOME}/.codex:/codex-home:ro
