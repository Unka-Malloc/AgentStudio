<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="50%" stop-color="#f0d28c"/>
      <stop offset="100%" stop-color="#a8893a"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a8ea8"/>
      <stop offset="100%" stop-color="#b0c0d4"/>
    </linearGradient>
  </defs>

  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#0d0d12"/>

  <!-- Octagon (scaled to fit 64x64, centered at 32,32) -->
  <polygon fill="none"
    points="46.2,38.6 38.6,46.2 25.4,46.2 17.8,38.6 17.8,25.4 25.4,17.8 38.6,17.8 46.2,25.4"
    stroke="url(#g)" stroke-width="1.4" opacity="0.75"/>

  <!-- Ring 1 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#d4c5a0" stroke-width="1" opacity="0.55"/>

  <!-- Ring 2 — offset -->
  <circle cx="29" cy="35" r="17" fill="none" stroke="url(#s)" stroke-width="0.9" opacity="0.50"/>

  <!-- Ring 3 — offset opposite -->
  <circle cx="34" cy="30" r="12" fill="none" stroke="#a0b0c4" stroke-width="0.9" opacity="0.55"/>

  <!-- Inner ring -->
  <circle cx="32" cy="32" r="7" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.65"/>

  <!-- Central dot -->
  <circle cx="32" cy="32" r="1.5" fill="#c9a96e" opacity="0.7"/>
</svg>
