<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script>
      (function () {
        try {
          var presets = {
            'default-system': true,
            'geek-light-blue': true,
            'catppuccin-latte': true,
            'github-light': true,
            'one-light': true,
            'sunset-ember': true,
            'tokyo-night': true,
            'monokai': true,
            'cyberpunk': true,
            'cappuccino-dark': true
          };
          var legacyPresetMap = {
            'cloud-light': 'geek-light-blue',
            'ocean-light': 'geek-light-blue',
            'grove-light': 'geek-light-blue',
            'geek-blue': 'geek-light-blue',
            'graphite-dark': 'sunset-ember',
            'ember-dark': 'sunset-ember',
            'sunset-glow': 'sunset-ember',
            'midnight-blue': 'sunset-ember',
            'material-ocean': 'sunset-ember',
            'monokai-pro': 'monokai',
            'cyberpunk-neon': 'cyberpunk',
            'neon-cyber': 'cyberpunk',
            'catppuccin-mocha': 'cappuccino-dark'
          };
          var preset = localStorage.getItem('pact-appearance-preset');
          if (legacyPresetMap[preset]) {
            preset = legacyPresetMap[preset];
          }
          if (!presets[preset]) {
            var legacy = localStorage.getItem('pact-theme');
            preset = legacy === 'dark'
              ? 'sunset-ember'
              : legacy === 'light'
                ? 'geek-light-blue'
                : 'default-system';
          }
          localStorage.setItem('pact-appearance-preset', preset);
          document.documentElement.dataset.appearancePreset = preset;
        } catch (e) {}
      })();
    </script>
    <title>Pact 服务端控制台</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body translate="no" class="notranslate">
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
